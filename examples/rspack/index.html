<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>srcset + Rspack</title>
  <style>
    body {
      margin: 0 auto;
      padding: 2rem 1rem 4rem;
      max-width: 48rem;
      font-family: system-ui, sans-serif;
      line-height: 1.5;
      color: #1c1c1e;
      background: #fdfdfd;
    }

    h1 {
      margin-bottom: .25rem;
    }

    .intro {
      margin-top: 0;
      color: #55555c;
    }

    section {
      margin: 2.5rem 0;
      padding-top: 1.5rem;
      border-top: 1px solid #e3e3e6;
    }

    h2 {
      font-size: 1.1rem;
      margin: 0 0 .75rem;
    }

    picture {
      display: block;
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
      margin-inline: auto;
      border-radius: 6px;
      background-color: #ececef;
    }

    .caption {
      margin: .5rem 0 0;
      font-size: .9rem;
      color: #55555c;
    }

    .variants {
      margin: .75rem 0 0;
      padding: .5rem .75rem;
      list-style: none;
      font-size: .75rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #3c3c43;
      background: #f2f2f5;
      border-radius: 6px;
      overflow-x: auto;
    }

    .variants li {
      white-space: nowrap;
    }

    /* Makes the transparency of the sticker visible. */
    picture.checkerboard {
      display: flex;
      justify-content: center;
      overflow: hidden;
      border-radius: 6px;
      background-color: #fff;
      background-image:
        linear-gradient(45deg, #dedee4 25%, transparent 25%, transparent 75%, #dedee4 75%),
        linear-gradient(45deg, #dedee4 25%, transparent 25%, transparent 75%, #dedee4 75%);
      background-size: 24px 24px;
      background-position: 0 0, 12px 12px;
    }

    picture.checkerboard img {
      background-color: transparent;
    }
  </style>
</head>
<body>
  <h1>srcset + Rspack</h1>
  <p class="intro">
    Four image imports processed by <code>@srcset/loader</code> at build time, wired through
    <code>module.rules</code> of Rspack and rendered with the <code>Picture</code> and
    <code>Image</code> components of <code>@srcset/react</code>.
  </p>
  <main id="app"></main>
</body>
</html>
