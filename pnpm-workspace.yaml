packages:
  - packages/*
  - examples/*
  - website
autoInstallPeers: false
overrides:
  '@srcset/core@*': workspace:^
  '@srcset/loader@*': workspace:^
  '@srcset/preact@*': workspace:^
  '@srcset/react@*': workspace:^
  '@srcset/runtime@*': workspace:^
  '@srcset/svelte@*': workspace:^
  '@srcset/vite-plugin@*': workspace:^
allowBuilds:
  '@swc/core': true
  esbuild: true
  sharp: true
  simple-git-hooks: true
minimumReleaseAgeExclude:
  - '@oxlint-tsgolint/darwin-arm64@0.25.0'
  - '@oxlint-tsgolint/darwin-x64@0.25.0'
  - '@oxlint-tsgolint/linux-arm64@0.25.0'
  - '@oxlint-tsgolint/linux-x64@0.25.0'
  - '@oxlint-tsgolint/win32-arm64@0.25.0'
  - '@oxlint-tsgolint/win32-x64@0.25.0'
  - oxlint-tsgolint@0.25.0
  - argue-cli@3.2.0
packageExtensions:
  '@sveltejs/package':
    dependencies:
      typescript: ^5.9.0
