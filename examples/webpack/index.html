<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>srcset + webpack</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, sans-serif;
    }

    body {
      max-width: 48rem;
      margin: 0 auto;
      padding: 2rem 1rem 4rem;
      color: #1b1b1f;
      background: #fff;
      line-height: 1.5;
    }

    h1 {
      margin-bottom: 0.25rem;
    }

    .intro {
      margin-top: 0;
      color: #5c5c66;
    }

    .demo {
      margin: 2.5rem 0;
      padding-top: 1.5rem;
      border-top: 1px solid #e3e3e8;
    }

    .demo h2 {
      margin: 0 0 0.5rem;
      font-size: 1.1rem;
    }

    .demo picture {
      display: block;
    }

    .demo img {
      display: block;
      margin-inline: auto;
      max-width: 100%;
      height: auto;
      border-radius: 6px;
    }

    .caption {
      margin: 0.75rem 0 0;
      font-size: 0.9rem;
      color: #5c5c66;
    }

    .variants {
      margin: 0.5rem 0 0;
      padding: 0;
      list-style: none;
      font: 0.75rem/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #6a6a75;
      overflow-x: auto;
    }

    .variants li {
      white-space: nowrap;
    }

    .variants b {
      color: #1b1b1f;
      font-weight: 600;
    }

    .checkerboard {
      display: flex;
      justify-content: center;
      border-radius: 6px;
      background-color: #fff;
      background-image:
        linear-gradient(45deg, #e3e3e8 25%, transparent 25%, transparent 75%, #e3e3e8 75%),
        linear-gradient(45deg, #e3e3e8 25%, transparent 25%, transparent 75%, #e3e3e8 75%);
      background-size: 20px 20px;
      background-position: 0 0, 10px 10px;
    }

    .placeholder-swatch {
      width: 8rem;
      height: 6rem;
      margin-top: 0.5rem;
      border-radius: 6px;
      background-size: cover;
      background-position: center;
    }
  </style>
</head>
<body>
  <h1>srcset + webpack</h1>
  <p class="intro">
    Four image imports processed by <code>@srcset/loader</code> at build time, rendered with the
    <code>Picture</code> and <code>Image</code> components of <code>@srcset/preact</code>. Every
    variant listed below was generated by this build.
  </p>
  <main id="app"></main>
</body>
</html>
